services:
  postgres:
    image: 'postgres:latest' # postgres ma własny healthcheck
    ports:
      - '${DB_PORT}:${DB_PORT}'
    environment:
      - 'POSTGRES_DB=${DB_DATABASE}'
      - 'POSTGRES_PASSWORD=${DB_PASSWORD}'
      - 'POSTGRES_USER=${DB_USERNAME}'
      - 'PGPORT=${DB_PORT}'
    volumes:
      - pg_data:/var/lib/postgresql
    restart: unless-stopped
volumes:
  pg_data:
